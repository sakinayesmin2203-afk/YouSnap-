# Codemagic CI/CD configuration for YouSnap Android Application
# Documentation: https://docs.codemagic.io/yaml-quick-start/

workflows:
  android-release:
    name: YouSnap Release APK/AAB
    max_build_duration: 60
    instance_type: mac_mini_m2 # Free tier machine on Codemagic (500 free mins/month)
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "Com.yousnap.app"
      java: 17
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Set up environment and local properties
        script: |
          echo "Setting up Android SDK and properties..."
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi

          # Accept Android SDK licenses
          yes | sdkmanager --licenses 2>/dev/null || true

          # Ensure .env exists with SUPABASE_API_KEY from Codemagic Environment Variables
          if [ -n "$SUPABASE_API_KEY" ]; then
            echo "SUPABASE_API_KEY=$SUPABASE_API_KEY" > .env
          elif [ -n "$SUPABASE_API" ]; then
            echo "SUPABASE_API_KEY=$SUPABASE_API" > .env
          elif [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Ensure debug.keystore exists for signing (as .keystore files are gitignored)
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare Gradle wrapper
        script: |
          chmod +x gradlew

      - name: Build Release APK
        script: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB (App Bundle)
        script: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build Debug APK (fallback)
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt
      - "**/*.apk"
      - "**/*.aab"
    publishing:
      email:
        recipients:
          - sakinayesmin2203@gmail.com
        notify:
          success: true
          failure: true

  android-debug:
    name: YouSnap Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2 # Free tier machine on Codemagic
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "Com.yousnap.app"
      java: 17
    scripts:
      - name: Set up environment and local properties
        script: |
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi
          yes | sdkmanager --licenses 2>/dev/null || true
          if [ -n "$SUPABASE_API_KEY" ]; then
            echo "SUPABASE_API_KEY=$SUPABASE_API_KEY" > .env
          elif [ -n "$SUPABASE_API" ]; then
            echo "SUPABASE_API_KEY=$SUPABASE_API" > .env
          elif [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
      - name: Prepare Gradle wrapper
        script: |
          chmod +x gradlew
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk
      - "**/*.apk"
    publishing:
      email:
        recipients:
          - sakinayesmin2203@gmail.com
        notify:
          success: true
          failure: true
