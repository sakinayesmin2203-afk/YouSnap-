# Codemagic CI/CD configuration for YouSnap Android Application
# Documentation: https://docs.codemagic.io/yaml-quick-start/

workflows:
  android-release:
    name: YouSnap Release APK/AAB
    max_build_duration: 60
    instance_type: mac_mini_m2 # Free tier machine on Codemagic (500 free mins/month)
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "Com.yousnap.app"
      java: 17
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Set up environment and local properties
        script: |
          echo "Setting up Android SDK and properties..."
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi

          # Accept Android SDK licenses
          yes | sdkmanager --licenses 2>/dev/null || true

          # Ensure .env exists with SUPABASE_API_KEY from Codemagic Environment Variables
          if [ -n "$SUPABASE_API_KEY" ]; then
            echo "SUPABASE_API_KEY=$SUPABASE_API_KEY" > .env
          elif [ -n "$SUPABASE_API" ]; then
            echo "SUPABASE_API_KEY=$SUPABASE_API" > .env
          elif [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Ensure debug.keystore is decoded consistently from debug.keystore.base64 (macOS + Linux safe)
          # Never leave a 0-byte file or regenerate a random keystore if debug.keystore.base64 exists
          if [ -f debug.keystore ] && [ ! -s debug.keystore ]; then
            rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              if command -v python3 >/dev/null 2>&1; then
                python3 -c "import base64, pathlib; pathlib.Path('debug.keystore').write_bytes(base64.b64decode(pathlib.Path('debug.keystore.base64').read_text().strip()))"
              elif base64 --help 2>&1 | grep -q -- "--decode"; then
                base64 --decode debug.keystore.base64 > debug.keystore
              else
                base64 -D -i debug.keystore.base64 -o debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore
              fi
              if [ ! -s debug.keystore ]; then
                echo "ERROR: Failed to decode debug.keystore.base64!"
                exit 1
              fi
            else
              echo "WARNING: debug.keystore.base64 not found; generating a temporary debug.keystore"
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Optional: if KEYSTORE_BASE64 is configured in Codemagic secrets, decode it for release builds
          if [ -n "$KEYSTORE_BASE64" ]; then
            TARGET_KEYSTORE="${KEYSTORE_PATH:-$CM_BUILD_DIR/release-keystore.jks}"
            TARGET_PATH="$TARGET_KEYSTORE" python3 -c "import base64, os, pathlib; pathlib.Path(os.environ['TARGET_PATH']).write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'].strip()))" 2>/dev/null || true
            if [ -s "$TARGET_KEYSTORE" ] && [ -n "$CM_ENV" ]; then
              echo "KEYSTORE_PATH=$TARGET_KEYSTORE" >> "$CM_ENV"
            fi
          fi

          echo "Active signing keystore SHA-1 / SHA-256:"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Prepare Gradle wrapper
        script: |
          chmod +x gradlew

      - name: Build Release APK
        script: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB (App Bundle)
        script: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build Debug APK (fallback)
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt
      - "**/*.apk"
      - "**/*.aab"
    publishing:
      email:
        recipients:
          - sakinayesmin2203@gmail.com
        notify:
          success: true
          failure: true

  android-debug:
    name: YouSnap Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2 # Free tier machine on Codemagic
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "Com.yousnap.app"
      java: 17
    scripts:
      - name: Set up environment and local properties
        script: |
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi
          yes | sdkmanager --licenses 2>/dev/null || true
          if [ -n "$SUPABASE_API_KEY" ]; then
            echo "SUPABASE_API_KEY=$SUPABASE_API_KEY" > .env
          elif [ -n "$SUPABASE_API" ]; then
            echo "SUPABASE_API_KEY=$SUPABASE_API" > .env
          elif [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore ] && [ ! -s debug.keystore ]; then
            rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              if command -v python3 >/dev/null 2>&1; then
                python3 -c "import base64, pathlib; pathlib.Path('debug.keystore').write_bytes(base64.b64decode(pathlib.Path('debug.keystore.base64').read_text().strip()))"
              elif base64 --help 2>&1 | grep -q -- "--decode"; then
                base64 --decode debug.keystore.base64 > debug.keystore
              else
                base64 -D -i debug.keystore.base64 -o debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore
              fi
              if [ ! -s debug.keystore ]; then
                echo "ERROR: Failed to decode debug.keystore.base64!"
                exit 1
              fi
            else
              echo "WARNING: debug.keystore.base64 not found; generating a temporary debug.keystore"
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          echo "Active signing keystore SHA-1 / SHA-256:"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true
      - name: Prepare Gradle wrapper
        script: |
          chmod +x gradlew
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk
      - "**/*.apk"
    publishing:
      email:
        recipients:
          - sakinayesmin2203@gmail.com
        notify:
          success: true
          failure: true
