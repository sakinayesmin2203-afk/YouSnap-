workflows:
  android-workflow:
    name: Android Workflow
    environment:
      java: 17
    scripts:
      - name: Set Gradle Version
        script: |
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
      - name: Build APK
        script: |
          gradle assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk

